<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Firehouse BOGO watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style id="css">
:root{--bg:#EDF2F6;--surface:#FFFFFF;--ink:#0D1B2A;--ink-2:#46566A;--ink-3:#6E7E91;--line:#D3DCE5;--red:#C8102E;--on-red:#FFFFFF;--red-soft:#F7D7DC;--amber:#7A4F00;--amber-soft:#FFEDBF;--blue:#1D4E89;--lamp:#C3CDD7;--display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;--body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A141E;--surface:#112030;--ink:#E7EEF4;--ink-2:#A9B7C5;--ink-3:#8494A4;--line:#22354A;--red:#E0334A;--on-red:#FFFFFF;--red-soft:#3B1820;--amber:#F3C452;--amber-soft:#3A2D0E;--blue:#7AA9E3;--lamp:#2A394A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A141E;--surface:#112030;--ink:#E7EEF4;--ink-2:#A9B7C5;--ink-3:#8494A4;--line:#22354A;--red:#E0334A;--on-red:#FFFFFF;--red-soft:#3B1820;--amber:#F3C452;--amber-soft:#3A2D0E;--blue:#7AA9E3;--lamp:#2A394A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-text-size-adjust:100%}
main{max-width:760px;margin:0 auto;padding:28px 20px 56px}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h2{font:600 24px/1.15 var(--display);margin:0 0 4px}
h3{font:600 19px/1.2 var(--display);margin:0 0 6px}
section{margin-top:44px}
.sub{color:var(--ink-2);margin:0 0 16px;max-width:62ch}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:start}
.lamp{width:68px;height:68px;border-radius:50%;background:var(--lamp);margin-top:8px}
.lamp.on{background:var(--red);box-shadow:0 0 0 10px var(--red-soft)}
.q{font:500 19px/1.2 var(--display);color:var(--ink-2);margin:0}
.ans{font:700 clamp(68px,17vw,116px)/.86 var(--display);margin:4px 0 12px}
.ans.yes{color:var(--red)}
.why{font-size:19px;line-height:1.45;margin:0;max-width:46ch}
.rows{margin:26px 0 0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row dt{font:600 17px/1.45 var(--display);color:var(--ink-2)}
.row dd{margin:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--ink-2);margin:0 0 12px;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:6px}
.sw-k{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid var(--line);background:var(--surface)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font:500 14px/1 var(--display);color:var(--ink-3);text-align:center;padding:0 0 6px}
.blank{min-height:66px}
.c{appearance:none;border:1px solid transparent;background:var(--surface);border-radius:6px;min-height:66px;padding:6px 7px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.c .n{font:600 18px/1 var(--display)}
.c .mk{font:500 13px/1.15 var(--display);letter-spacing:.02em}
.c.yes{background:var(--red);color:var(--on-red)}
.c.no,.c.pre{color:var(--ink-3)}
.c.possible{background:transparent;border:1px dashed var(--ink-3);color:var(--ink-2)}
.c.unlogged{background:var(--amber-soft);color:var(--amber)}
.c.later{background:transparent;color:var(--ink-3)}
.c.today{outline:2px solid var(--blue);outline-offset:1px}
.c[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.c.yes[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--on-red)}
.hint{color:var(--ink-3);font-size:15px;margin:12px 0 0}
.detail{margin-top:12px;background:var(--surface);border-radius:10px;padding:14px 16px}
.detail p{margin:0}
.detail ul{margin:6px 0 0;padding-left:20px}
.log{display:flex;flex-direction:column;gap:8px}
.lg{background:var(--surface);border-radius:10px;padding:12px 14px}
.lg p{margin:0 0 10px}
.when{font:600 17px/1 var(--display);margin-right:6px}
.ch{display:flex;gap:8px;flex-wrap:wrap}
.btn{appearance:none;font:500 15px/1.2 var(--body);padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;min-height:40px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.save{margin-top:12px;background:var(--red);color:var(--on-red);border-color:var(--red)}
.note{color:var(--ink-2);margin:12px 0 0}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.tm{appearance:none;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;width:100%}
.sw{width:38px;height:22px;border-radius:11px;background:var(--lamp);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#FFFFFF;transition:transform .15s ease-out}
.tm[aria-checked="true"] .sw{background:var(--red)}
.tm[aria-checked="true"] .sw::after{transform:translateX(16px)}
.tn{display:block;font:600 19px/1.1 var(--display)}
.tr{display:block;font-size:14px;color:var(--ink-2)}
.fine{font-size:14px;color:var(--ink-3);margin:44px 0 0;max-width:62ch}
@media (max-width:540px){.hero{gap:16px}.lamp{width:48px;height:48px}.lamp.on{box-shadow:0 0 0 7px var(--red-soft)}.why{font-size:17px}.row{grid-template-columns:96px minmax(0,1fr)}.c,.blank{min-height:52px}.c{padding:5px}.c .n{font-size:16px}.c .mk{font-size:0}.c .mk:not(:empty)::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor}}
@media (prefers-reduced-motion:no-preference){.lamp.on.flash{animation:flash .8s ease-out 2}}
@keyframes flash{0%,100%{opacity:1}45%{opacity:.3}}
</style>
</head>

    }
    var yes = 0, total = 0;
    for (var s = DATA.start; s <= TODAY; s = add(s, 1)) { total++; if (status(s) === "yes") yes++; }
    var h = '<div class="hero"><div class="lamp' + (lit ? " on" : "") + (lit && first ? " flash" : "") + '" aria-hidden="true"></div><div>';
    h += '<h1 class="q">Firehouse BOGO today?</h1><p class="ans' + (lit ? " yes" : "") + '">' + word + '</p><p class="why">' + why + "</p></div></div>";
    h += '<dl class="rows"><div class="row"><dt>Tonight</dt><dd>' + tonight + "</dd></div>";
    if (next) h += '<div class="row"><dt>Next chance</dt><dd>' + next + "</dd></div>";
    h += '<div class="row"><dt>Season so far</dt><dd>' + yes + " BOGO " + (yes === 1 ? "day" : "days") + " in " + total + " days since opening night</dd></div></dl>";
    return h;
  }

  var LABEL = { yes: "BOGO day", no: "No BOGO", pre: "Opening night", possible: "BOGO possible", unlogged: "Waiting on a result", later: "No BOGO expected" };
  function calHTML() {
    var h = '<section aria-labelledby="cal-h"><h2 id="cal-h">Season so far</h2><p class="sub">Each day shows whether the BOGO was good that day, based on the night before.</p>';
    h += '<ul class="legend"><li><span class="sw-k" style="background:var(--red);border-color:var(--red)"></span>BOGO day</li><li><span class="sw-k"></span>No BOGO</li><li><span class="sw-k" style="background:transparent;border:1px dashed var(--ink-3)"></span>Possible</li><li><span class="sw-k" style="background:var(--amber-soft);border-color:var(--amber-soft)"></span>Needs a result</li><li><span class="sw-k" style="outline:2px solid var(--blue);outline-offset:1px"></span>Today</li></ul>';
    h += '<div class="cal">' + WD.map(function (w) { return '<div class="wd" aria-hidden="true">' + w + "</div>"; }).join("");
    var lastGame = DATA.games[DATA.games.length - 1][0];
    var end = add(lastGame, 1) > TODAY ? add(lastGame, 1) : TODAY;
    var from = add(DATA.start, -dow(DATA.start)), to = add(end, 6 - dow(end));
    for (var d = from; d <= to; d = add(d, 1)) {
      if (d < DATA.start) { h += '<div class="blank"></div>'; continue; }
      var s = status(d), dn = toDate(d).getUTCDate(), p = add(d, -1);
      var label = (dn === 1 || d === DATA.start ? MO[toDate(d).getUTCMonth()] + " " : "") + dn;
      var marks = "";
      if (s === "yes") marks = wins(p).map(function (g) { return g.w; }).join(" ");
      else if (s === "possible" || s === "unlogged") marks = night(p).filter(function (g) { return !g.w; }).map(function (g) { return on.has(g.h) ? g.h : g.a; }).join(" ");
      h += '<button class="c ' + s + (d === TODAY ? " today" : "") + '" data-day="' + d + '" aria-pressed="' + (selected === d) + '" aria-label="' + fmt(d) + ", " + LABEL[s] + (d === TODAY ? ", today" : "") + '"><span class="n">' + label + '</span><span class="mk">' + marks + "</span></button>";
    }
    return h + "</div>" + detailHTML() + "</section>";
  }
  function detailHTML() {
    if (!selected) return '<p class="hint">Tap a day to see the games behind it.</p>';
    var D = selected, p = add(D, -1), s = status(D), ng = night(p), body;
    if (s === "pre") body = "<p>Nothing to redeem yet. The first chance came the next day.</p>";
    else if (!ng.length) body = "<p>None of your teams " + (p < TODAY ? "played " : "play ") + longDay(p) + (p > DATA.scheduleEnd ? ". That part of the schedule isn\u2019t loaded yet." : ".") + "</p>";
    else body = "<p>" + longDay(p) + "\u2019s games:</p><ul>" + ng.map(function (g) { return "<li>" + preview(g) + (!g.w && g.d < TODAY ? ", result not logged" : "") + "</li>"; }).join("") + "</ul>";
    return '<div class="detail" aria-live="polite"><h3>' + fmt(D) + ": " + LABEL[s] + "</h3>" + body + "</div>";
  }

  function logHTML() {
    var todo = games.filter(function (g) { return !g.w && (live ? g.d < TODAY : g.d <= TODAY) && mine(g); });
    if (live && !todo.length && !msg) return "";
    var h = '<section aria-labelledby="log-h"><h2 id="log-h">' + (live ? "Missing results" : "Log results") + "</h2>";
    if (!todo.length) h += '<p class="sub">Nothing to log right now. After your teams play, tap the winner here and the calendar updates.</p>';
    else {
      h += '<p class="sub">' + (live ? "The automatic update hasn\u2019t picked these up yet. If you know who won, tap them to see your BOGO now." : "Tap who won. Overtime and shootout wins count.") + '</p><div class="log">';
      todo.forEach(function (g) {
        h += '<div class="lg"><p><span class="when">' + (g.d === TODAY ? "Tonight" : fmt(g.d)) + "</span>" + name(g.a) + " at " + name(g.h) + '</p><div class="ch">';
        [g.a, g.h].forEach(function (t) { h += '<button class="btn" data-pick="' + g.id + '" data-w="' + t + '" aria-pressed="' + (pending[g.id] === t) + '">' + name(t) + " won</button>"; });
        h += "</div></div>";
      });
      h += "</div>";
      var n = Object.keys(pending).length;
      if (n) h += '<button class="btn save" data-save>' + (saving ? "Saving\u2026" : "Save " + n + (n > 1 ? " results" : " result")) + "</button>";
    }
    if (msg) h += '<p class="note" role="status">' + msg + "</p>";
    return h + "</section>";
  }

  function teamsHTML() {
    var h = '<section aria-labelledby="tm-h"><h2 id="tm-h">Teams that count</h2><p class="sub">Senators, Leafs, Oilers and Flames are on by default. Turn on another team if the Firehouse app shows the offer after one of its wins.</p><div class="teams">';
    ORDER.forEach(function (t) {
      h += '<button class="tm" role="switch" aria-checked="' + on.has(t) + '" data-team="' + t + '"><span class="sw" aria-hidden="true"></span><span><span class="tn">' + TEAMS[t] + '</span><span class="tr">' + rec(t) + " so far</span>" + (NOTES[t] ? '<span class="tr">' + NOTES[t] + "</span>" : "") + "</span></button>";
    });
    return h + "</div></section>";
  }

  function footHTML() {
    var when = "";
    if (live && DATA.updatedAt) { var u = new Date(DATA.updatedAt); when = " Last new result came in " + fmt(u.getFullYear() + "-" + pad(u.getMonth() + 1) + "-" + pad(u.getDate())) + " at " + u.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + "."; }
    return '<p class="fine">' + (live ? "Scores update automatically about every 30 minutes on game nights." + when : "Scores through " + fmt(add(DATA.updated, -1)) + ", schedule through " + fmt(DATA.scheduleEnd) + ".") + " Assumes the BOGO is good the day after a win, overtime and shootout wins included. Game times are Eastern. Check the Offers tab in the Firehouse Subs app before you order.</p>";
  }

  var app = document.getElementById("app");
  function keyOf(el) {
    if (!el || !app.contains(el) || !el.dataset) return null;
    if (el.dataset.day) return '[data-day="' + el.dataset.day + '"]';
    if (el.dataset.team) return '[data-team="' + el.dataset.team + '"]';
    if (el.dataset.pick) return '[data-pick="' + el.dataset.pick + '"][data-w="' + el.dataset.w + '"]';
    if (el.hasAttribute("data-save")) return "[data-save]";
    return null;
  }
  function render() {
    var k = keyOf(document.activeElement);
    app.innerHTML = heroHTML() + calHTML() + logHTML() + teamsHTML() + footHTML();
    if (k) { var el = app.querySelector(k); if (el) el.focus(); }
    first = false;
  }

  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-day],[data-team],[data-pick],[data-save]");
    if (!t) return;
    if (t.dataset.day) { selected = selected === t.dataset.day ? null : t.dataset.day; render(); return; }
    if (t.dataset.team) {
      var tm = t.dataset.team;
      if (on.has(tm)) on.delete(tm); else on.add(tm);
      lsSet(LS_TEAMS, Array.from(on));
      render(); return;
    }
    if (t.dataset.pick) {
      if (pending[t.dataset.pick] === t.dataset.w) delete pending[t.dataset.pick]; else pending[t.dataset.pick] = t.dataset.w;
      msg = ""; render(); return;
    }
    if (t.hasAttribute("data-save")) save();
  });

  var artP = (window.claude && typeof window.claude.use === "function")
    ? Promise.resolve(window.claude.use("artifact")).catch(function () { return null; })
    : Promise.resolve(null);

  function buildDoc() {
    var data = {
      updated: DATA.updated, start: DATA.start, scheduleEnd: DATA.scheduleEnd,
      games: games.map(function (g) {
        var r = [g.d, g.t, g.a, g.h, g.as, g.hs];
        if (g.w && g.as == null) r.push(g.w);
        return r;
      })
    };
    var json = JSON.stringify(data).replace(/</g, "\\u003c");
    var css = document.getElementById("css").textContent;
    var js = document.getElementById("logic").textContent;
    return "<!doctype html>\n<html lang=\"en\">\n<head>\n" + HEAD + '<style id="css">' + css + "</style>\n</head>\n<body>\n<main id=\"app\"></main>\n" +
      '<script type="application/json" id="data">' + json + "<\/script>\n" +
      '<script id="logic">' + js + "<\/script>\n</body>\n</html>\n";
  }

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function tryPublish(art) {
    for (var i = 0; i < 2; i++) {
      try { await art.publish(buildDoc()); return "ok"; }
      catch (e) {
        var c = e && e.code;
        if (c === "conflict") return "conflict";
        if (["not_writer", "not_granted", "not_declared", "consent_required", "capability_disabled", "capability_removed"].indexOf(c) > -1) return "readonly";
        if (c === "upstream_error" && i === 0) { await wait(700 + Math.random() * 900); continue; }
        return "error";
      }
    }
    return "error";
  }

  async function save() {
    var ids = Object.keys(pending);
    if (!ids.length || saving) return;
    saving = true;
    var ov = lsGet(LS_RES) || {};
    ids.forEach(function (id) {
      var g = games.find(function (x) { return x.id === id; });
      if (g && !g.w) { g.w = pending[id]; ov[id] = pending[id]; }
    });
    lsSet(LS_RES, ov);
    msg = "Saving\u2026"; render();
    pending = {};
    var art = readOnly ? null : await artP;
    if (!art) { saving = false; msg = "Saved on this device."; render(); return; }
    var res = await tryPublish(art);
    saving = false;
    if (res === "ok") msg = "Saved.";
    else if (res === "conflict") msg = "A newer version was saved somewhere else. Loading it now, and your results stay on this device.";
    else if (res === "readonly") { readOnly = true; msg = "This copy is read-only, so your results are saved on this device."; }
    else msg = "Couldn\u2019t update the shared page, so your results are saved on this device.";
    render();
  }

  function refresh() {
    if (!window.fetch) return;
    fetch("data.json", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !Array.isArray(d.games) || !d.games.length) return;
        var changed = !live || d.updatedAt !== DATA.updatedAt || todayIso() !== TODAY;
        DATA = d; live = true; TODAY = todayIso();
        if (changed) { games = buildGames(); render(); }
      })
      .catch(function () {});
  }

  render();
  refresh();
  setInterval(refresh, 10 * 60 * 1000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
